#
# È l'unica lista di siti nel repository: WhatsMyName, Sherlock e Maigret si scaricano dai loro
# repository (scheda Config > Aggiorna liste) e restano fuori da git. Anche questo file si aggiorna
# dalla scheda Config. I siti personali dell'utente stanno in mytargets.yaml, non qui.
#
# Ogni sito è verificato con un account vero (trovato) e uno inventato (non trovato).

# ============================================================ siti trovati da UserSnex
# Assenti da WhatsMyName, Sherlock e Maigret.
- name: Altervista
  category: blog
  url: https://{username}.altervista.org
  check_url: https://{username}.altervista.org
  type: html
  regex: "^[A-Za-z0-9-]{3,40}$"
  found_status: [200]
  dns_missing: true          # se il sottodominio non esiste nel DNS, il blog non c'è
  known: ["mario"]
- name: Audius
  category: musica
  url: https://audius.co/{username}
  check_url: https://api.audius.co/v1/users/handle/{username}?app_name=UserSnex
  require: data.id
  fields:
    display_name: data.name
    bio: data.bio
    location: data.location
  known:
  - audius
  source: UserSnex (verificato 23/11/2026)
