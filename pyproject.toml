[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "usersnex"
version = "1.0.1"
description = "Username OSINT con correlazione d'identità e punteggio di fiducia"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pyyaml>=6", "colorama>=0.4", "customtkinter>=5.2,<6", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
usersnex = "usersnex.cli:main"
usersnex-gui = "usersnex.gui:main"

[tool.setuptools.packages.find]
include = ["usersnex*"]

[tool.setuptools.package-data]
usersnex = ["sites/*.yaml"]
